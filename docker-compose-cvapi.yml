name: cv-devops

services:
  # --- DATA BASE ---
  # POSTGRES
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: cv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cv-postgres-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- APPLICATION ---
  # API
  api:
    build:
      context: ./api
      target: development
    container_name: cv-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend, monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    develop:
      watch:
        - path: ./api/src   
          action: sync+restart
          target: /app/src
        - path: ./api/pom.xml
          action: rebuild

  # NGINX
  nginx:
    image: nginx:1.30.6-alpine3.24
    container_name: cv-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

networks:
  frontend:
  backend:
    name: cv-backend
  monitoring:
    name: cv-monitoring

volumes:
  cv-postgres-data: