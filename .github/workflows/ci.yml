name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 1. Valida que los composes sean correctos
  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validar composes
        run: |
          cp .env.example .env
          docker compose -f docker-compose-cvapi.yml config -q
          docker compose -f docker-compose-monitoring.yml config -q

  # 2. Construye la imagen, la escanea y (solo en main/tags) la publica en GHCR
  build-scan-push:
    needs: compose-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      # GHCR exige el nombre de imagen en minúsculas
      - name: Nombre de imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cv-devops-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.3.0

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # Build local (sin publicar) para poder escanearla antes
      - name: Build (target production)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./api
          target: production
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Falla el pipeline si hay vulnerabilidades altas/críticas con parche disponible
      - name: Trivy - escaneo de la imagen
        uses: aquasecurity/trivy-action@v0.36.0  
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Mala configuración del Dockerfile: informativo, no bloquea
      - name: Trivy - revisión del Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./api
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Publicar solo si no es un PR
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./api
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
