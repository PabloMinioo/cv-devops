name: cv-devops

services:
  api:
    build:
      context: ./api
      target: development
    container_name: cv-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    develop:
      watch:
        - action: sync+restart
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/pom.xml

networks:
  frontend:
  backend:

volumes:
  db-data: