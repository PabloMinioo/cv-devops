global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # PROMETHEUS
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]  
  # API 
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]  
  # CONTEINERS
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]  
  # SERVER
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  # DATABASE
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  # LOGS
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]